name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: TEST AND BUILD JAVA BACKEND
  # ------------------------------------------------------------------
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Run Java Tests & Build
        run: ./mvnw clean package
      
      # Optional: Upload the built jar as an artifact
      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app
          path: target/*.jar

  # ------------------------------------------------------------------
  # JOB 2: TEST PYTHON OPTIMISER
  # ------------------------------------------------------------------
  python-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python  # Switch to python folder

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip' # Caches dependencies to speed up future runs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock # Install test runners

      - name: Run Pytest
        run: pytest

  # ------------------------------------------------------------------
  # JOB 3: BUILD FRONTEND (REACT)
  # ------------------------------------------------------------------
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend # Switch to frontend folder

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

  # ------------------------------------------------------------------
  # JOB 4: DOCKER BUILD (Ensure containers build successfully)
  # ------------------------------------------------------------------
  docker-check:
    runs-on: ubuntu-latest
    needs: [backend-test, python-test, frontend-build] # Only run if tests pass
    steps:
      - uses: actions/checkout@v4
      
      # This builds the images defined in your docker-compose file
      # to ensure your Dockerfiles are valid.
      - name: Build Docker Images
        run: docker-compose build